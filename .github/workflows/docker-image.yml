name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # needed for using the GITHUB_TOKEN

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

    - name: Build the Docker image
      # builds the image, reusing cached layers from previous runs
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
      with:
        context: go_http_endpoint
        file: go_http_endpoint/http_endpoint.dockerfile
        tags: http-endpoint:latest
        load: true # put the image in the local Docker so `docker run` can find it
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Run the container for testing
      # maps the container's port to the port that
      # the test container uses
      run: docker run -d -p 80:3000 --name http-endpoint http-endpoint:latest
    
    - name: run Liatrio's tests
      # uses the hash for a previous release
      # avoids just grabbing whatever the latest
      # version is and at the moment gets around
      # an unimplemented issue
      uses: liatrio/github-actions/apprentice-action@5d1fa21f3d370ceaa4f67bae080db2523eb12ff6

    - name: set up node for my own tests
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '22'

    - name: minified test
      run: node --test tests/minified.test.mjs

    - name: login to GHCR (Github's container image repository)
      if: github.event_name == 'push'
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        # this is a token created by github
        # when the action is run
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Tag and push
      if: github.event_name == 'push'
      # Updates latest to this push.
      # Also saves this push to its own, unique SHA marked
      # image for access after subsequent pushes.
      # the ",," after "GITHUB_REPOSITORY_OWNER" makes it all
      # lowercase.
      # The "::7" after the SHA variable has it take only 7
      # characters from the full SHA.
      run: |
        IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/http-endpoint
        docker tag http-endpoint:latest $IMAGE:latest
        docker tag http-endpoint:latest $IMAGE:${GITHUB_SHA::7}
        docker push $IMAGE:latest
        docker push $IMAGE:${GITHUB_SHA::7}

  deploy:
    # only deploys images that passed the tests and were pushed
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read # pull the image back from GHCR
      id-token: write # lets GitHub hand Google an OIDC token (no stored keys)

    steps:
    - name: authenticate to Google Cloud
      id: auth
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
        service_account: ${{ vars.GCP_DEPLOY_SA }}
        token_format: access_token

    - name: login to GHCR
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: login to Artifact Registry
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
      with:
        registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
        username: oauth2accesstoken
        password: ${{ steps.auth.outputs.access_token }}

    - name: copy the image from GHCR to Artifact Registry
      # Cloud Run can only pull from Google's registries,
      # so the exact image that was tested gets copied over.
      # The SHA tag means every deploy is a distinct revision.
      id: image
      run: |
        SRC=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/http-endpoint:${GITHUB_SHA::7}
        DST=${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_AR_REPO }}/http-endpoint:${GITHUB_SHA::7}
        docker pull $SRC
        docker tag $SRC $DST
        docker push $DST
        echo "ref=$DST" >> "$GITHUB_OUTPUT"

    - name: deploy to Cloud Run
      id: deploy
      uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3.0.1
      with:
        service: ${{ vars.GCP_SERVICE }}
        region: ${{ vars.GCP_REGION }}
        image: ${{ steps.image.outputs.ref }}
        # the Fiber app listens on 3000, and the endpoint is public
        flags: >-
          --port=3000
          --service-account=${{ vars.GCP_RUNTIME_SA }}
          --allow-unauthenticated
          --min-instances=0
          --max-instances=2

    - name: smoke test the deployed endpoint
      run: curl --fail --silent --show-error "${{ steps.deploy.outputs.url }}"